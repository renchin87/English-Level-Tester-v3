<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>English Level Test A1–C2</title>

<style>
:root{
 --bg:#f3f4f6;
 --card:#fff;
 --ink:#0f172a;
 --mute:#64748b;
 --line:#e2e8f0;
 --bar:#e5e7eb;
 --fill:#0f172a;
 --ok:#16a34a;
 --okbg:#dcfce7;
 --bad:#dc2626;
 --badbg:#fee2e2;
 --chip:#f1f5f9;
 --shadow:0 10px 30px rgba(15,23,42,.08);
}

@media(prefers-color-scheme:dark){
 :root:not([data-theme="light"]){
  --bg:#0b1220;
  --card:#162033;
  --ink:#f1f5f9;
  --mute:#94a3b8;
  --line:#2a3750;
  --bar:#2a3750;
  --fill:#f1f5f9;
  --okbg:#143523;
  --badbg:#4c1d1d;
  --chip:#222f47;
  --shadow:0 10px 30px rgba(0,0,0,.4);
 }
}

:root[data-theme="dark"]{
 --bg:#0b1220;
 --card:#162033;
 --ink:#f1f5f9;
 --mute:#94a3b8;
 --line:#2a3750;
 --bar:#2a3750;
 --fill:#f1f5f9;
 --okbg:#143523;
 --badbg:#4c1d1d;
 --chip:#222f47;
 --shadow:0 10px 30px rgba(0,0,0,.4);
}

*{
 box-sizing:border-box;
 -webkit-tap-highlight-color:transparent;
}

html,body{
 margin:0;
 min-height:100%;
 background:var(--bg);
 color:var(--ink);
 font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
 overflow-x:hidden;
}

body{
 display:flex;
 justify-content:center;
 padding:64px 16px 32px;
}

#theme{
 position:fixed;
 top:calc(env(safe-area-inset-top,0px) + 12px);
 right:14px;
 width:44px;
 height:44px;
 border-radius:50%;
 border:0;
 background:var(--card);
 box-shadow:var(--shadow);
 font-size:20px;
 cursor:pointer;
 z-index:5;
}

.card{
 width:100%;
 max-width:440px;
 background:var(--card);
 border-radius:28px;
 box-shadow:var(--shadow);
 padding:24px 20px;
}

.top{
 display:flex;
 justify-content:space-between;
 align-items:baseline;
 font-weight:600;
 font-size:15px;
}

.top span:last-child{
 color:var(--mute);
}

.bar{
 height:8px;
 background:var(--bar);
 border-radius:99px;
 margin:12px 0 16px;
 overflow:hidden;
}

.bar i{
 display:block;
 height:100%;
 width:0;
 background:var(--fill);
 border-radius:99px;
 transition:width .5s ease;
}

.meta{
 display:flex;
 justify-content:space-between;
 align-items:center;
 font-size:14px;
 color:var(--mute);
}

.chip{
 background:var(--chip);
 padding:5px 12px;
 border-radius:99px;
 font-weight:600;
 font-size:13px;
 color:var(--ink);
}

h1{
 font-size:30px;
 margin:0 0 8px;
 letter-spacing:-.5px;
}

h2.q{
 font-size:24px;
 line-height:1.3;
 margin:20px 0;
 letter-spacing:-.3px;
}

.opts{
 display:grid;
 gap:10px;
}

.opt{
 display:flex;
 align-items:center;
 gap:12px;
 width:100%;
 min-height:58px;
 padding:12px 16px;
 border:2px solid var(--line);
 background:var(--card);
 color:var(--ink);
 border-radius:18px;
 font-size:17px;
 text-align:left;
 cursor:pointer;
 font-family:inherit;
 transition:.15s;
}

.opt b{
 flex:none;
 width:28px;
 height:28px;
 border-radius:50%;
 background:var(--chip);
 display:grid;
 place-items:center;
 font-size:13px;
}

.opt:active{
 transform:scale(.99);
}

.opt.ok{
 border-color:var(--ok);
 background:var(--okbg);
}

.opt.bad{
 border-color:var(--bad);
 background:var(--badbg);
}

.opt.ok b{
 background:var(--ok);
 color:#fff;
}

.opt.bad b{
 background:var(--bad);
 color:#fff;
}

.opt:disabled{
 cursor:default;
 color:var(--ink);
 opacity:1;
}

.fb{
 margin-top:16px;
 padding:14px 16px;
 border-radius:16px;
 font-size:15px;
 line-height:1.45;
}

.fb strong{
 display:block;
 margin-bottom:4px;
 font-size:16px;
}

.fb.ok{
 background:var(--okbg);
}

.fb.ok strong{
 color:var(--ok);
}

.fb.bad{
 background:var(--badbg);
}

.fb.bad strong{
 color:var(--bad);
}

.btn{
 display:block;
 width:100%;
 min-height:56px;
 margin-top:16px;
 border:0;
 border-radius:18px;
 background:var(--fill);
 color:var(--bg);
 font-size:18px;
 font-weight:700;
 cursor:pointer;
 font-family:inherit;
}

.btn.ghost{
 background:var(--chip);
 color:var(--ink);
}

.center{
 text-align:center;
}

.sub{
 color:var(--mute);
 font-size:17px;
 margin:0 0 6px;
}

.big{
 font-size:56px;
 margin:8px 0 12px;
}

.ring{
 position:relative;
 width:170px;
 height:170px;
 margin:20px auto;
}

.ring svg{
 transform:rotate(-90deg);
}

.ring circle{
 fill:none;
 stroke-width:12;
}

.ring .t{
 stroke:var(--bar);
}

.ring .f{
 stroke-linecap:round;
 transition:stroke-dashoffset 1s ease;
}

.ring div{
 position:absolute;
 inset:0;
 display:grid;
 place-content:center;
 font-size:36px;
 font-weight:800;
}

.ring small{
 display:block;
 font-size:13px;
 font-weight:600;
 color:var(--mute);
 text-align:center;
}

.grid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:10px;
 margin:16px 0;
}

.stat{
 background:var(--chip);
 border-radius:16px;
 padding:14px;
 text-align:center;
}

.stat b{
 display:block;
 font-size:24px;
}

.stat span{
 font-size:13px;
 color:var(--mute);
}

.level{
 display:inline-block;
 padding:8px 18px;
 border-radius:99px;
 font-weight:700;
 background:var(--chip);
}

h3{
 margin:24px 0 10px;
 font-size:17px;
}

.miss{
 border:1px solid var(--line);
 border-radius:16px;
 padding:12px 14px;
 margin-bottom:10px;
 font-size:15px;
 line-height:1.45;
}

.miss p{
 margin:0 0 6px;
 font-weight:600;
}

.miss .r{
 color:var(--bad);
}

.miss .g{
 color:var(--ok);
}

.miss em{
 display:block;
 margin-top:6px;
 color:var(--mute);
 font-style:normal;
 font-size:14px;
}

.inp{
 width:100%;
 min-height:56px;
 border:2px solid var(--line);
 border-radius:18px;
 padding:0 16px;
 font-size:17px;
 background:var(--card);
 color:var(--ink);
 font-family:inherit;
 margin-top:8px;
}

.who{
 display:flex;
 justify-content:space-between;
 align-items:center;
 margin-bottom:14px;
 font-weight:600;
}

.who button{
 border:0;
 background:var(--chip);
 color:var(--ink);
 border-radius:99px;
 padding:10px 16px;
 font-size:14px;
 cursor:pointer;
 font-family:inherit;
}

.h{
 display:flex;
 justify-content:space-between;
 gap:8px;
 padding:10px 0;
 border-bottom:1px solid var(--line);
 font-size:14px;
}

.h span:last-child{
 color:var(--mute);
 text-align:right;
}

.info{
 background:var(--chip);
 border-radius:18px;
 padding:14px;
 margin:14px 0;
 font-size:14px;
 line-height:1.5;
}

.auto{
 border:2px solid var(--line);
 background:var(--card);
 color:var(--ink);
 border-radius:18px;
 padding:16px;
 text-align:left;
 cursor:pointer;
 width:100%;
 font-family:inherit;
}

.auto strong{
 display:block;
 font-size:17px;
 margin-bottom:4px;
}

.auto small{
 color:var(--mute);
 line-height:1.4;
}

.divider{
 height:1px;
 background:var(--line);
 margin:22px 0;
}
</style>
</head>

<body>

<button id="theme" aria-label="Toggle theme">🌓</button>

<main class="card" id="card"></main>

<script>

/* =========================================================
   QUESTION DATA
   [type, question, options(first = correct), explanation]

const Q=[

['v','What number comes after nine?',['Ten','Eight','Eleven','Seven'],'9-ийн дараа 10 буюу ten ирнэ.'],
['v','Which month comes after January?',['February','March','December','April'],'January-ийн дараа February орно.'],
['v','Your mother\'s mother is your ...',['grandmother','aunt','sister','daughter'],'Ээжийн ээжийг grandmother буюу эмээ гэдэг.'],
['v','Which one is a drink?',['Milk','Bread','Rice','Apple'],'Milk = сүү, уудаг зүйл.'],

['v','A person who helps sick people in a hospital is a ...',['doctor','farmer','pilot','singer'],'Doctor = эмч.'],
['v','Which one is yellow?',['Banana','Cherry','Carrot','Potato'],'Banana = гадил бөгөөд ихэвчлэн шар өнгөтэй.'],
['v','Your parents\' other son is your ...',['brother','uncle','cousin','grandfather'],'Эцэг эхийн чинь өөр нэг хүү бол brother буюу ах/дүү.'],

['v','Which word is a color?',['Purple','Monday','Pizza','Doctor'],'Purple = нил ягаан өнгө.'],

['v','Which one is a job?',['Pilot','Pencil','Pizza','Purple'],'Pilot = нисгэгч, мэргэжил.'],

['g','I ___ a student.',['am','is','are','be'],'I-тэй am хэрэглэнэ: I am a student.'],
['g','She ___ my sister.',['is','am','are','do'],'She/he/it-тэй is хэрэглэнэ.'],
['g','They ___ from Mongolia.',['are','is','am','be'],'They/we/you-тэй are хэрэглэнэ.'],
['g','He ___ a dog.',['has','have','having','haves'],'He/she/it-тэй has хэрэглэнэ.'],

['g','How old ___ you?',['are','is','am','do'],'You-тэй are хэрэглэнэ.'],
